# Copy to secrets.yaml next to centurion.yaml and replace every value.
# secrets.yaml is git-ignored. Do not commit real credentials or certificates.
#
# MQTT TLS:
# - mqtt_broker must be the DNS hostname in the broker certificate's SAN.
#   Do not use an IP address unless the certificate also has an IP SAN.
# - mqtt_ca_certificate is the PEM CA certificate that signs the broker's
#   server certificate. It is a public certificate, not a private key.
#   Include the BEGIN/END lines. Do not paste a server certificate here unless
#   it really is the CA you intend to trust.
# - Use a dedicated MQTT account with device-scoped command/state and discovery
#   permissions (see README.md). Never use a broker administrator account.
#
# The API key is only needed if you enable the optional native API:
#   openssl rand -base64 32
#
# centurion_mac is the operator's Bluetooth address. Find it in the ESPHome
# logs (the tracker prints discovered devices) or with a BLE scanner.
#
# centurion_phone must be the exact international number registered in
# MyCentsys Pro, for example "+27821234567".

wifi_ssid: "REPLACE_WITH_WIFI_SSID"
wifi_password: "REPLACE_WITH_WIFI_PASSWORD"
fallback_password: "REPLACE_WITH_FALLBACK_PASSWORD"
ota_password: "REPLACE_WITH_OTA_PASSWORD"

# Optional native API only; leave unused for the default pure-MQTT build.
# api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"

mqtt_broker: "mqtt.example.com"
mqtt_username: "REPLACE_WITH_DEDICATED_MQTT_USERNAME"
mqtt_password: "REPLACE_WITH_DEDICATED_MQTT_PASSWORD"

# Replace this whole block with the broker CA certificate. The placeholder is
# deliberately not a valid certificate, so a forgotten replacement fails closed
# during the TLS handshake instead of silently trusting something else.
mqtt_ca_certificate: |
  -----BEGIN CERTIFICATE-----
  REPLACE_WITH_YOUR_BROKER_CA_CERTIFICATE_PEM
  -----END CERTIFICATE-----

# Optional mutual TLS. Uncomment these and the matching lines in centurion.yaml
# only if the broker requires a client certificate. Keep the private key secret.
# mqtt_client_certificate: |
#   -----BEGIN CERTIFICATE-----
#   REPLACE_WITH_YOUR_CLIENT_CERTIFICATE_PEM
#   -----END CERTIFICATE-----
# mqtt_client_key: |
#   -----BEGIN PRIVATE KEY-----
#   REPLACE_WITH_YOUR_CLIENT_PRIVATE_KEY_PEM
#   -----END PRIVATE KEY-----

centurion_mac: "AA:BB:CC:DD:EE:FF"
centurion_phone: "+27821234567"
